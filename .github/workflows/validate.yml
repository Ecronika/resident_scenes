name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # current Home Assistant and the minimum version in hacs.json (0.13.317 = Home Assistant 2026.3.1)
        plugin: ["pytest-homeassistant-custom-component", "pytest-homeassistant-custom-component==0.13.317"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "${{ matrix.plugin }}" ruff
      - run: ruff check custom_components tests run11.py
      - run: pytest --cov=custom_components.resident_scenes --cov-report=term-missing

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      # the built card is part of every release, so it must match its source
      - run: git diff --exit-code custom_components/resident_scenes/frontend/resident-scenes-card.js
      - run: npm test

  # the next Home Assistant version before its test package exists (spec 6); does not block
  next-ha:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - run: pip install "homeassistant==2026.11.1"  # conflicts with the test package on purpose
      - run: python run11.py --cov=custom_components.resident_scenes
