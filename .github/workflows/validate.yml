name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # current Home Assistant and the minimum version in hacs.json (0.13.317 = Home Assistant 2026.3.1)
        plugin: ["pytest-homeassistant-custom-component", "pytest-homeassistant-custom-component==0.13.317"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "${{ matrix.plugin }}" ruff
      - run: ruff check custom_components tests
      - run: node --check custom_components/resident_scenes/frontend/resident-scenes-card.js
      - run: npm i --no-save jsdom && node tests/card.test.cjs
      - run: pytest --cov=custom_components.resident_scenes --cov-report=term-missing
